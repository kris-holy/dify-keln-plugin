model: deepseek-ai/deepseek-v4.1-flash-1017
label:
  en_US: deepseek-ai/deepseek-v4.1-flash-1017
model_type: llm
features:
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
  - vision
model_properties:
  mode: chat
  context_size: 1048576
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: max_tokens
    use_template: max_tokens
    default: 8192
    min: 1
    max: 32768
  - name: reasoning_effort
    label:
      en_US: Reasoning effort
    type: string
    required: false
    default: max
    help:
      en_US: How much the model reasons before answering. none turns reasoning off.
    options:
      - none
      - low
      - high
      - max
  - name: response_format
    use_template: response_format
    options:
      - text
      - json_object
      - json_schema
  - name: json_schema
    use_template: json_schema
