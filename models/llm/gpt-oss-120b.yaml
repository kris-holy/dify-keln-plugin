model: openai/gpt-oss-120b
label:
  en_US: openai/gpt-oss-120b
model_type: llm
features:
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 131072
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: max_tokens
    use_template: max_tokens
    default: 8192
    min: 1
    max: 32768
  - name: reasoning_effort
    label:
      en_US: Reasoning effort
    type: string
    required: false
    default: high
    help:
      en_US: How much the model reasons before answering. This model always reasons.
    options:
      - low
      - medium
      - high
  - name: response_format
    use_template: response_format
    options:
      - text
      - json_object
      - json_schema
  - name: json_schema
    use_template: json_schema
